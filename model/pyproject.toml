[project]
name = "motionbricks-mlx"
version = "0.1.0"
description = "MLX port of NVIDIA MotionBricks (SOMA + Unitree G1) for Apple silicon"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.29",
    "numpy>=1.26",
]

[project.optional-dependencies]
# `motionbricks-mlx download` needs no extra packages; `test` runs model/tests without the sandbox.
test = ["pytest>=8"]

[project.scripts]
motionbricks-mlx = "motionbricks_mlx.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["motionbricks_mlx"]
