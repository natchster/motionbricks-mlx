[package]
name = "motionbricks-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Rust ports of NVIDIA's MotionBricks applications (Inbetweener, Scene Preview, Smart Primitive Editor, Scene Editor) on a wgpu viewer, calling the Rust model and Runtime API (model-rs)"
publish = false

[dependencies]
winit = "0.30"
wgpu = "29"
imgui = { version = "0.12", features = ["docking", "tables-api"] }
imgui-wgpu = "0.28"
imgui-winit-support = "0.13"
pollster = "0.4"
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
lexopt = "0.3"
# The Rust model + Runtime API (Metal runtime / mlx-rs): the apps call it for clip and
# skeleton IO, engines and motion players — never Python.
motionbricks-rs = { path = "../model-rs" }
quick-xml = { version = "0.37", features = ["serialize"] }

[profile.release]
debug = 1

[[bin]]
name = "viewer-demo"
path = "src/bin/viewer_demo.rs"

[[bin]]
name = "scene-editor"
path = "src/bin/scene_editor.rs"

[[bin]]
name = "smart-primitive-editor"
path = "src/bin/smart_primitive_editor.rs"

[[bin]]
name = "inbetweener"
path = "src/bin/inbetweener.rs"

[[bin]]
name = "scene-preview"
path = "src/bin/scene_preview.rs"
