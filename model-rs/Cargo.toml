[package]
name = "motionbricks-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "NVIDIA MotionBricks in Rust: an op-for-op mlx-rs port of motionbricks_mlx, a model-specific Metal runtime, and the Runtime API"
publish = false

[dependencies]
mlx-rs = "0.34"
# Same pinned version mlx-rs uses, so Cargo links one MLX build. Needed for the raw slice op.
mlx-sys = { version = "=0.7.0", default-features = false }
half = "2"
anyhow = "1"
libc = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
csv = "1"
rand_pcg = "0.10"
# Benchmark and development binaries: argument parsing and JSON reports.
lexopt = "0.3"
serde_json = "1"
# Custom Metal runtime (src/metal): direct bindings, no MLX in the hot path.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-io-kit = { version = "0.3", default-features = false, features = ["std", "libc"] }
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = { version = "3", default-features = false }

[features]
# Development binaries (metal-stages, metal-precision): `cargo run --release --features dev-tools --bin ...`.
dev-tools = []

[profile.release]
debug = 1

[[bin]]
name = "mbrs-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "gemm-tune"
path = "src/bin/gemm_tune.rs"

[[bin]]
name = "metal-stages"
path = "src/bin/metal_stages.rs"
required-features = ["dev-tools"]

[[bin]]
name = "metal-precision"
path = "src/bin/metal_precision.rs"
required-features = ["dev-tools"]
